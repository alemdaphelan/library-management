server {
    listen 80;
    server_name localhost;

    # Backend API Routing
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS is intentionally handled by Spring Security from the
        # CORS_ALLOWED_ORIGINS allow-list. Do not add wildcard headers here.
    }

    # The legacy controllers are not all namespaced under /api/v1 yet.
    # Keep their public paths reachable through the same local gateway.
    location ~ ^/(books|categories|loans|book-copies|locations|dashboard|digital-assets|waitlist|users|inventory|proposals|admin)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Upgrade / STOMP
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Frontend (Placeholder for static hosting)
    location / {
        # proxy_pass http://frontend:4200/; # In dev mode
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
