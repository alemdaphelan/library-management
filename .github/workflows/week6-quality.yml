name: Week 11 quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    name: Repository handoff preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets, generated files and Compose manifest
        shell: pwsh
        run: ./scripts/week12d-preflight.ps1

  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests (PostgreSQL and Redis use Testcontainers)
        run: ./mvnw --batch-mode test
      - name: Package backend
        run: ./mvnw --batch-mode -DskipTests package

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test -- --watch=false

  mobile:
    name: Mobile analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  compose:
    name: Validate local deployment manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
