<div class="search-page container">
  <!-- Search Header -->
  <div class="search-header">
    <div class="search-box-large" style="position: relative;">
      <input type="text" placeholder="Tìm kiếm sách, tác giả, chủ đề..." class="search-input-large" 
             [(ngModel)]="searchQuery" 
             (ngModelChange)="onSearchInput($event)"
             (keyup.enter)="onSearch()"
             (blur)="onBlur()"
             (focus)="onFocus()">
      <button class="btn-primary" (click)="onSearch()">Tìm kiếm</button>

      <!-- Quick Search Dropdown -->
      <div class="quick-search-dropdown" *ngIf="showDropdown && quickSearchResults.length > 0">
        <ul class="quick-search-list">
          <li *ngFor="let book of quickSearchResults" (mousedown)="goToBook(book.id)">
            <div class="quick-search-item">
              <img *ngIf="!book.imgError" [src]="book.cover" alt="{{book.title}}" (error)="book.imgError = true">
              <div class="quick-search-fallback" *ngIf="book.imgError || !book.cover">
                <span>{{ book.title | slice:0:1 }}</span>
              </div>
              <div class="quick-search-info">
                <h4 [innerHTML]="highlightMatch(book.title)"></h4>
                <p [innerHTML]="highlightMatch(book.author)"></p>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="search-layout">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar card">
      <h3 class="filter-title">Bộ lọc tìm kiếm</h3>
      
      <div class="filter-group">
        <h4>Trạng thái</h4>
        <label class="checkbox-label"><input type="radio" name="status" value="all" [(ngModel)]="filterStatus" (change)="applyFilters()"> Tất cả</label>
        <label class="checkbox-label"><input type="radio" name="status" value="available" [(ngModel)]="filterStatus" (change)="applyFilters()"> Có sẵn</label>
        <label class="checkbox-label"><input type="radio" name="status" value="borrowed" [(ngModel)]="filterStatus" (change)="applyFilters()"> Đang mượn</label>
      </div>

      <div class="filter-group">
        <h4>Thể loại</h4>
        <label class="checkbox-label" *ngFor="let cat of availableCategories; let i = index">
          <input type="checkbox" name="category_{{i}}" [(ngModel)]="selectedCategories[cat]" (change)="applyFilters()"> {{ cat }}
        </label>
      </div>

      <button class="btn-outline w-100" (click)="clearFilters()">Xóa bộ lọc</button>
    </aside>

    <!-- Search Results -->
    <main class="search-results">
      <div class="results-meta">
        <span>Tìm thấy <strong>{{ books.length }}</strong> kết quả phù hợp</span>
        
        <div class="meta-actions">
          <!-- View Toggle -->
          <div class="view-toggle">
            <button class="toggle-btn" [class.active]="viewMode === 'grid'" (click)="setViewMode('grid')" title="Lưới">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button class="toggle-btn" [class.active]="viewMode === 'list'" (click)="setViewMode('list')" title="Danh sách">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
          </div>
          
          <select class="sort-select" [(ngModel)]="sortOption" (change)="applyFilters()">
            <option value="newest">Mới nhất</option>
            <option value="az">Tên A-Z</option>
            <option value="za">Tên Z-A</option>
          </select>
        </div>
      </div>

      <!-- Book Grid/List -->
      <div class="book-container" [class.book-grid]="viewMode === 'grid'" [class.book-list]="viewMode === 'list'">
        
        <div class="card book-card" *ngFor="let book of books">
          <div class="book-cover-wrapper" routerLink="/book/1" style="cursor: pointer;">
            <img *ngIf="!book.imgError" [src]="book.cover" alt="{{ book.title }}" class="book-cover-img" (error)="book.imgError = true">
            <div class="book-cover-fallback" *ngIf="book.imgError || !book.cover">
              <span>{{ book.title }}</span>
            </div>
            <div class="book-overlay">
              <button class="btn-primary btn-sm" routerLink="/book/1">Xem chi tiết</button>
            </div>
          </div>
          <div class="book-info">
            <span class="badge-available" *ngIf="book.status === 'available'">Có sẵn</span>
            <span class="badge-pending" *ngIf="book.status === 'borrowed'">Đã mượn hết</span>
            <div class="book-cat">{{ book.category }}</div>
            <h3 class="book-name" routerLink="/book/1" style="cursor: pointer;">{{ book.title }}</h3>
            <p class="book-author">{{ book.author }}</p>
          </div>
        </div>

      </div>
      
      <!-- Pagination -->
      <div class="pagination" *ngIf="totalPages > 0">
        <button class="page-btn" (click)="prevPage()" [disabled]="currentPage === 0">&lsaquo; Trước</button>
        <ng-container *ngFor="let p of visiblePages">
          <button class="page-btn" 
                  *ngIf="p !== '...'" 
                  [class.active]="p === (currentPage + 1)" 
                  (click)="onPageClick(p)">
            {{ p }}
          </button>
          <button class="page-btn" *ngIf="p === '...'" disabled>...</button>
        </ng-container>
        <button class="page-btn" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1">Tiếp &rsaquo;</button>
      </div>
    </main>
  </div>
</div>
