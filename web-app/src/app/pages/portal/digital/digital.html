<div class="digital-page container">
  <div class="page-header text-center">
    <h1>TÀI NGUYÊN SỐ & CSDL QUỐC TẾ</h1>
    <p>Truy cập miễn phí các cơ sở dữ liệu học thuật hàng đầu thế giới dành riêng cho Sinh viên & Giảng viên HUIT.</p>
  </div>

  <div class="db-grid">
    <div class="db-card" *ngFor="let db of databases">
      <div class="db-logo-wrapper">
        <img [src]="db.img" alt="{{db.name}}" class="db-logo">
      </div>
      <div class="db-info">
        <h3>{{ db.name }}</h3>
        <p>{{ db.desc }}</p>
        <a [href]="db.link" class="btn-access">Truy cập ngay &rarr;</a>
      </div>
    </div>
  </div>
</div>
