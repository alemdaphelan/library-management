spring:
  application:
    name: library-management
  datasource:
    url: jdbc:postgresql://localhost:5432/library_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: schema.sql
  data:
    mongodb:
      uri: mongodb://localhost:27017/library_log
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
