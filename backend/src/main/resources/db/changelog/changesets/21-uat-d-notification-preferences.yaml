databaseChangeLog:
  - changeSet:
      id: 21-uat-d-create-notification-preferences
      author: codex
      changes:
        - createTable:
            tableName: notification_preferences
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_notification_preferences_user
                    references: users(user_id)
              - column:
                  name: email_enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: push_enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
