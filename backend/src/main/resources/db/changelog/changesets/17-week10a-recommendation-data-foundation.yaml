  - changeSet:
      id: week10a-classify-books-with-high-confidence-keywords
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              WITH rules(subject_code, pattern, confidence) AS (
                VALUES
                  ('IT_DATA_AI', '\m(computer|programming|software|database|algorithm|network|cybersecurity|artificial intelligence|machine learning|data science|java|python|linux|web development|information systems?)\M', 0.950),
                  ('FOOD_TECH', '\m(food science|food technology|food processing|food safety|quality assurance|seafood|fisheries)\M', 0.930),
                  ('CULINARY_NUTRITION', '\m(nutrition|culinary|cooking|cookbook|gastronomy|food service)\M', 0.900),
                  ('CHEM_BIO_ENV', '\m(chemistry|biochemistry|biology|biotechnology|environmental science|ecology|materials science)\M', 0.930),
                  ('BUSINESS_MARKETING', '\m(business|marketing|commerce|entrepreneurship|business management)\M', 0.900),
                  ('FINANCE_ACCOUNTING', '\m(accounting|finance|banking|fintech|investment management)\M', 0.930),
                  ('LAW', '\m(law|legal|jurisprudence|legislation)\M', 0.900),
                  ('TEXTILE_FASHION', '\m(textile|fashion|garment|apparel)\M', 0.920),
                  ('ENGINEERING_AUTOMATION', '\m(mechanical engineering|mechatronics|electrical engineering|electronics|automation|control systems?|thermodynamics|manufacturing engineering)\M', 0.930),
                  ('TOURISM_HOSPITALITY', '\m(tourism|hospitality|hotel management|restaurant management|travel management)\M', 0.930),
                  ('LANGUAGES', '\m(english language|chinese language|linguistics|translation studies)\M', 0.900),
                  ('LOGISTICS_INDUSTRIAL', '\m(logistics|supply chain|operations management|industrial management)\M', 0.930)
              )
              INSERT INTO book_subject_assignments (
                  book_id, subject_id, confidence, classification_source, evidence, primary_subject)
              SELECT
                  b.book_id,
                  s.subject_id,
                  r.confidence,
                  'KEYWORD_HIGH_CONFIDENCE',
                  'title matched controlled rule: ' || r.subject_code,
                  ROW_NUMBER() OVER (
                      PARTITION BY b.book_id
                      ORDER BY r.confidence DESC, r.subject_code
                  ) = 1
              FROM books b
              JOIN rules r ON COALESCE(b.title, '') ~* r.pattern
              JOIN recommendation_subjects s ON s.code = r.subject_code
              ON CONFLICT (book_id, subject_id) DO NOTHING;

              ANALYZE recommendation_subjects;
              ANALYZE department_subject_affinities;
              ANALYZE book_subject_assignments;
