databaseChangeLog:
  - changeSet:
      id: week10a-create-recommendation-data-foundation
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE TABLE recommendation_subjects (
                  subject_id BIGSERIAL PRIMARY KEY,
                  code VARCHAR(64) NOT NULL UNIQUE,
                  name VARCHAR(255) NOT NULL,
                  description VARCHAR(1000),
                  active BOOLEAN NOT NULL DEFAULT TRUE,
                  created_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  updated_at TIMESTAMP NOT NULL DEFAULT NOW()
              );

              CREATE TABLE department_subject_affinities (
                  affinity_id BIGSERIAL PRIMARY KEY,
                  department_key VARCHAR(255) NOT NULL,
                  display_name VARCHAR(255) NOT NULL,
                  subject_id BIGINT NOT NULL REFERENCES recommendation_subjects(subject_id),
                  weight NUMERIC(4,3) NOT NULL,
                  source VARCHAR(64) NOT NULL DEFAULT 'HUIT_2026',
                  active BOOLEAN NOT NULL DEFAULT TRUE,
                  created_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  updated_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  CONSTRAINT uk_department_subject UNIQUE (department_key, subject_id),
                  CONSTRAINT chk_department_subject_weight CHECK (weight > 0 AND weight <= 1)
              );

              CREATE TABLE book_subject_assignments (
                  assignment_id BIGSERIAL PRIMARY KEY,
                  book_id BIGINT NOT NULL REFERENCES books(book_id) ON DELETE CASCADE,
                  subject_id BIGINT NOT NULL REFERENCES recommendation_subjects(subject_id),
                  confidence NUMERIC(4,3) NOT NULL,
                  classification_source VARCHAR(64) NOT NULL,
                  evidence VARCHAR(500),
                  primary_subject BOOLEAN NOT NULL DEFAULT FALSE,
                  created_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  updated_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  CONSTRAINT uk_book_recommendation_subject UNIQUE (book_id, subject_id),
                  CONSTRAINT chk_book_subject_confidence CHECK (confidence > 0 AND confidence <= 1),
                  CONSTRAINT chk_book_subject_source CHECK (
                      classification_source IN (
                          'MANUAL', 'IMPORTED', 'KEYWORD_HIGH_CONFIDENCE', 'LEGACY_REVIEWED'
                      )
                  )
              );

              CREATE INDEX idx_department_subject_key
                  ON department_subject_affinities(department_key)
                  WHERE active = TRUE;
              CREATE INDEX idx_book_subject_book ON book_subject_assignments(book_id);
              CREATE INDEX idx_book_subject_subject ON book_subject_assignments(subject_id);

