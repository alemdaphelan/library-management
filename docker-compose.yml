services:
  # 1. API Gateway / Reverse Proxy
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: library_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - library-network

  # 2. Core Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/huit_library_events?authSource=admin
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION:-2592000000}
      - QR_SECRET=${QR_SECRET:-huit-library-development-qr-secret-change-in-production}
      - QR_TTL_MINUTES=${QR_TTL_MINUTES:-10}
      - DATABASE_SEEDING_ENABLED=${DATABASE_SEEDING_ENABLED:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      - DIGITAL_STORAGE_PATH=/app/data/digital-assets
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - SPRING_MAIL_SMTP_AUTH=false
      - SPRING_MAIL_SSL_ENABLE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_BASE_URL=${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - GEMINI_GENERATION_MODEL=${GEMINI_GENERATION_MODEL:-gemini-3.6-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      - RAG_EMBEDDING_PROVIDER=${RAG_EMBEDDING_PROVIDER:-auto}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_MINIMUM_SCORE=${RAG_MINIMUM_SCORE:-0.60}
      - RAG_MAX_INPUT_CHARACTERS=${RAG_MAX_INPUT_CHARACTERS:-1000}
      - RAG_CHUNK_SIZE_CHARACTERS=${RAG_CHUNK_SIZE_CHARACTERS:-900}
      - RAG_CHUNK_OVERLAP_CHARACTERS=${RAG_CHUNK_OVERLAP_CHARACTERS:-120}
      - RAG_CONNECT_TIMEOUT_SECONDS=${RAG_CONNECT_TIMEOUT_SECONDS:-5}
      - RAG_READ_TIMEOUT_SECONDS=${RAG_READ_TIMEOUT_SECONDS:-20}
      - RAG_REQUESTS_PER_MINUTE=${RAG_REQUESTS_PER_MINUTE:-10}
      - RAG_GENERATION_THINKING_BUDGET=${RAG_GENERATION_THINKING_BUDGET:-0}
      - FIREBASE_PUSH_ENABLED=${FIREBASE_PUSH_ENABLED:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON_BASE64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - digital_assets_data:/app/data/digital-assets
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - library-network

  # 3. Relational DB (PostgreSQL)
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg15}
    container_name: library_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - library-network

  # 4. NoSQL Event Store (MongoDB)
  mongodb:
    image: mongo:${MONGO_VERSION}
    container_name: library_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - library-network

  # 5. Search Engine (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: library_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - library-network

  # 6. Cache (Redis)
  redis:
    image: redis:${REDIS_VERSION}
    container_name: library_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - library-network

  # 7. Message Broker (Zookeeper + Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:${KAFKA_VERSION}
    container_name: library_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - library-network

  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: library_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - library-network

  # 8. Local SMTP capture for password-recovery testing
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: library_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - library-network

networks:
  library-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  es_data:
  redis_data:
  digital_assets_data:
